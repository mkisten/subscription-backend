server {
    listen 80;
    listen [::]:80;
    server_name openai.subscriptionhhapp.ru www.openai.subscriptionhhapp.ru;
    return 301 https://openai.subscriptionhhapp.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.openai.subscriptionhhapp.ru;

    ssl_certificate /etc/letsencrypt/live/openai.subscriptionhhapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openai.subscriptionhhapp.ru/privkey.pem;

    return 301 https://openai.subscriptionhhapp.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openai.subscriptionhhapp.ru;

    ssl_certificate /etc/letsencrypt/live/openai.subscriptionhhapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openai.subscriptionhhapp.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }
}
