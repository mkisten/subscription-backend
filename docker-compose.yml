version: '3.8'

services:
  subscription_postgres:
    image: postgres:15-alpine
    container_name: subscription_postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${SUBSCRIPTION_POSTGRES_DB}
      POSTGRES_USER: ${SUBSCRIPTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SUBSCRIPTION_POSTGRES_PASSWORD}
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUBSCRIPTION_POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  subscription_app:
    build: .
    container_name: subscription_backend
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Moscow
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://subscription_postgres:5432/${SUBSCRIPTION_POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${SUBSCRIPTION_POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${SUBSCRIPTION_POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_BOT_TOKEN_FAMILY=${TELEGRAM_BOT_TOKEN_FAMILY}
      - TELEGRAM_BOT_USERNAME_VACANCY=${TELEGRAM_BOT_USERNAME_VACANCY}
      - TELEGRAM_BOT_USERNAME_SHOPPING=${TELEGRAM_BOT_USERNAME_SHOPPING}
      - TELEGRAM_BOT_USERNAME_FAMILY=${TELEGRAM_BOT_USERNAME_FAMILY}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - SERVER_PORT=8080
      - SERVER_SSL_ENABLED=false
    depends_on:
      subscription_postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${GRAYLOG_GELF_HOST:-127.0.0.1}:12201"
        tag: "subscription_app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vacancy_postgres:
    image: postgres:15-alpine
    container_name: vacancy_postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${VACANCY_POSTGRES_DB}
      POSTGRES_USER: ${VACANCY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VACANCY_POSTGRES_PASSWORD}
    volumes:
      - vacancy_postgres_data:/var/lib/postgresql/data
      - ./vacancy-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VACANCY_POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  hh_parser_postgres:
    image: postgres:15-alpine
    container_name: hh_parser_postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${HH_PARSER_POSTGRES_DB:-hh_parser_service}
      POSTGRES_USER: ${HH_PARSER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${HH_PARSER_POSTGRES_PASSWORD:-postgres}
    volumes:
      - hh_parser_postgres_data:/var/lib/postgresql/data
      - ./hh-parser-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HH_PARSER_POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  hh_parser_app:
    build:
      context: .
      dockerfile: hh-parser-backend/Dockerfile
    container_name: hh_parser_backend
    ports:
      - "8084:8084"
    environment:
      - TZ=Europe/Moscow
      - SPRING_DATASOURCE_URL=jdbc:postgresql://hh_parser_postgres:5432/${HH_PARSER_POSTGRES_DB:-hh_parser_service}
      - SPRING_DATASOURCE_USERNAME=${HH_PARSER_POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${HH_PARSER_POSTGRES_PASSWORD:-postgres}
      - SERVER_PORT=8084
    depends_on:
      hh_parser_postgres:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - hh-parser-app
    restart: unless-stopped
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${GRAYLOG_GELF_HOST:-127.0.0.1}:12201"
        tag: "hh_parser_app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  habr_parser_postgres:
    image: postgres:15-alpine
    container_name: habr_parser_postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${HABR_PARSER_POSTGRES_DB:-habr_parser_service}
      POSTGRES_USER: ${HABR_PARSER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${HABR_PARSER_POSTGRES_PASSWORD:-postgres}
    volumes:
      - habr_parser_postgres_data:/var/lib/postgresql/data
      - ./habr-parser-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HABR_PARSER_POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  habr_parser_app:
    build:
      context: .
      dockerfile: habr-parser-backend/Dockerfile
    container_name: habr_parser_backend
    ports:
      - "8085:8085"
    environment:
      - TZ=Europe/Moscow
      - SPRING_DATASOURCE_URL=jdbc:postgresql://habr_parser_postgres:5432/${HABR_PARSER_POSTGRES_DB:-habr_parser_service}
      - SPRING_DATASOURCE_USERNAME=${HABR_PARSER_POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${HABR_PARSER_POSTGRES_PASSWORD:-postgres}
      - SERVER_PORT=8085
    depends_on:
      habr_parser_postgres:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - habr-parser-app
    restart: unless-stopped
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${GRAYLOG_GELF_HOST:-127.0.0.1}:12201"
        tag: "habr_parser_app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  getmatch_parser_postgres:
    image: postgres:15-alpine
    container_name: getmatch_parser_postgres
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${GETMATCH_PARSER_POSTGRES_DB:-getmatch_parser_service}
      POSTGRES_USER: ${GETMATCH_PARSER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${GETMATCH_PARSER_POSTGRES_PASSWORD:-postgres}
    volumes:
      - getmatch_parser_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GETMATCH_PARSER_POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  getmatch_parser_app:
    build:
      context: .
      dockerfile: getmatch-parser-backend/Dockerfile
    container_name: getmatch_parser_backend
    ports:
      - "8086:8086"
    environment:
      - TZ=Europe/Moscow
      - SPRING_DATASOURCE_URL=jdbc:postgresql://getmatch_parser_postgres:5432/${GETMATCH_PARSER_POSTGRES_DB:-getmatch_parser_service}
      - SPRING_DATASOURCE_USERNAME=${GETMATCH_PARSER_POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${GETMATCH_PARSER_POSTGRES_PASSWORD:-postgres}
      - SERVER_PORT=8086
      - GETMATCH_CACHE_TTL_MINUTES=${GETMATCH_CACHE_TTL_MINUTES:-30}
      - GETMATCH_PREFETCH_ENABLED=${GETMATCH_PREFETCH_ENABLED:-true}
      - GETMATCH_PREFETCH_DELAY_MS=${GETMATCH_PREFETCH_DELAY_MS:-300000}
      - GETMATCH_PREFETCH_INITIAL_DELAY_MS=${GETMATCH_PREFETCH_INITIAL_DELAY_MS:-120000}
      - GETMATCH_PREFETCH_MAX_PAGES=${GETMATCH_PREFETCH_MAX_PAGES:-10}
      - GETMATCH_PREFETCH_ACTIVE_WINDOW_MINUTES=${GETMATCH_PREFETCH_ACTIVE_WINDOW_MINUTES:-1440}
      - GETMATCH_PREFETCH_REQUEST_DELAY_MS=${GETMATCH_PREFETCH_REQUEST_DELAY_MS:-500}
    depends_on:
      getmatch_parser_postgres:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - getmatch-parser-app
    restart: unless-stopped
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${GRAYLOG_GELF_HOST:-127.0.0.1}:12201"
        tag: "getmatch_parser_app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vacancy_app:
    build:
      context: .
      dockerfile: vacancy-backend/Dockerfile
    container_name: vacancy_backend
    ports:
      - "8081:8081"
    environment:
      - TZ=Europe/Moscow
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://vacancy_postgres:5432/${VACANCY_POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${VACANCY_POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${VACANCY_POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=20
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=5
      - SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=30000
      - SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD=5000
      - SPRING_DATASOURCE_HIKARI_LOGGER_LEVEL=TRACE
      - LOGGING_LEVEL_COM_ZAXXER_HIKARI=DEBUG
      - SPRING_TASK_SCHEDULING_POOL_SIZE=1
      - APP_AUTO_UPDATE_WORKERS=1
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-https://api.subscriptionhhapp.ru}
      - HH_BASE_URL=${HH_BASE_URL:-http://hh-parser-app:8084/api}
      - HABR_ENABLED=${HABR_ENABLED:-true}
      - HABR_BASE_URL=${HABR_BASE_URL:-http://habr-parser-app:8085/api}
      - GETMATCH_ENABLED=${GETMATCH_ENABLED:-true}
      - GETMATCH_BASE_URL=${GETMATCH_BASE_URL:-http://getmatch-parser-app:8086/api}
      - SERVER_PORT=8081
      - SERVER_SERVLET_CONTEXT_PATH=/api
    depends_on:
      vacancy_postgres:
        condition: service_healthy
      hh_parser_app:
        condition: service_healthy
      habr_parser_app:
        condition: service_healthy
      getmatch_parser_app:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    logging:
      driver: "gelf"
      options:
        gelf-address: "udp://${GRAYLOG_GELF_HOST:-127.0.0.1}:12201"
        tag: "vacancy_app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  graylog_mongo:
    image: mongo:4.4
    container_name: graylog_mongo
    volumes:
      - graylog_mongo_data:/data/db
    networks:
      - app_network
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:1.3.14
    container_name: graylog_opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - graylog_opensearch_data:/usr/share/opensearch/data
    networks:
      - app_network
    restart: unless-stopped

  graylog:
    image: graylog/graylog:4.3
    container_name: graylog
    depends_on:
      - graylog_mongo
      - opensearch
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI}
      - GRAYLOG_MONGODB_URI=mongodb://graylog_mongo:27017/graylog
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    networks:
      - app_network
    restart: unless-stopped

volumes:
  subscription_postgres_data:
  vacancy_postgres_data:
  hh_parser_postgres_data:
  habr_parser_postgres_data:
  getmatch_parser_postgres_data:
  graylog_mongo_data:
  graylog_opensearch_data:

networks:
  app_network:
    driver: bridge

