server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://103.71.21.122:5433/vacancy_service
    username: postgres
    password: Nika12102014
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

auth:
  service:
    url: ${AUTH_SERVICE_URL:https://api.subscriptionhhapp.ru}

app:
  hhru:
    base-url: ${HH_BASE_URL:https://api.hh.ru}
    timeout: 10000
    requests-per-second: 10
    max-pages: 20
  habr:
    enabled: ${HABR_ENABLED:false}
    base-url: ${HABR_BASE_URL:http://127.0.0.1:8085/api}
    timeout: ${APP_HABR_TIMEOUT:10000}
    max-pages: ${APP_HABR_MAX_PAGES:10}
  getmatch:
    enabled: ${GETMATCH_ENABLED:false}
    base-url: ${GETMATCH_BASE_URL:http://127.0.0.1:8086/api}
    max-pages: ${APP_GETMATCH_MAX_PAGES:10}
  superjob:
    enabled: ${SUPERJOB_ENABLED:false}
    base-url: ${SUPERJOB_BASE_URL:http://127.0.0.1:8087/api}
    max-pages: ${APP_SUPERJOB_MAX_PAGES:10}
  rabota-by:
    enabled: ${RABOTA_BY_ENABLED:true}
    base-url: ${RABOTA_BY_BASE_URL:https://rabota.by}
    search-url: ${RABOTA_BY_SEARCH_URL:https://rabota.by/search/vacancy}
    timeout-ms: ${APP_RABOTA_BY_TIMEOUT:15000}
    user-agent: ${RABOTA_BY_USER_AGENT:Mozilla/5.0 (compatible; VacancyBot/1.0)}
    max-pages: ${APP_RABOTA_BY_MAX_PAGES:5}
  resume:
    storage-path: ${APP_RESUME_STORAGE_PATH:uploads/resumes}
  ai-resume:
    base-url: ${AI_RESUME_BASE_URL:https://codex.sale/v1}
    api-key: ${AI_RESUME_API_KEY:}
    model: ${AI_RESUME_MODEL:gpt-5.4-mini}
    timeout-ms: ${AI_RESUME_TIMEOUT_MS:90000}
    user-agent: ${AI_RESUME_USER_AGENT:Mozilla/5.0 (compatible; VacancyResumeAssistant/1.0)}
    max-vacancy-text-length: ${AI_RESUME_MAX_VACANCY_TEXT_LENGTH:18000}
    max-resume-text-length: ${AI_RESUME_MAX_RESUME_TEXT_LENGTH:30000}
  auto-update:
    workers: 1

logging:
  level:
    com.mkisten.vacancybackend: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
